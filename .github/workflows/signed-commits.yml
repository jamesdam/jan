# Comment on PRs that contain unsigned commits. The rulesets on main and
# release/* require verified signatures, and GitHub only says so in the merge
# box, so contributors otherwise find out late.
#
# pull_request_target so it can comment on PRs from forks. It must never check
# out or run PR code: it only reads the PR's commit list through the API.
name: Signed Commits
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release
      - 'release/**'

concurrency:
  group: signed-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check_signatures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check commit signatures
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = '<!-- signed-commits-check -->';
            const DOCS = 'https://github.com/janhq/jan/blob/main/CONTRIBUTING.md#signed-commits';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // The API returns at most 250 commits for a PR; anything past that
            // is not checked (the ruleset still blocks the merge).
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const unsigned = commits.filter((c) => !c.commit.verification?.verified);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const sticky = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(MARKER),
            );

            if (unsigned.length === 0) {
              core.info(`All ${commits.length} commits are verified.`);
              if (sticky) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: sticky.id });
              }
              return;
            }

            // Code spans keep commit messages from rendering markdown or @-mentions.
            const code = (s) => '`' + s.replace(/`/g, "'") + '`';
            const firstLine = (m) => {
              const line = m.split('\n', 1)[0];
              return line.length > 72 ? line.slice(0, 71) + '…' : line;
            };
            const hints = {
              unsigned: 'no signature',
              unknown_key: 'key not on GitHub as a signing key',
              unverified_email: 'commit email not verified on GitHub',
              bad_email: 'commit email not on the key\'s GitHub account',
              no_user: 'commit email not on any GitHub account',
            };
            const reason = (v) => hints[v?.reason] ?? v?.reason ?? 'unknown';
            const rows = unsigned.map((c) =>
              `- ${c.sha.slice(0, 7)} ${code(firstLine(c.commit.message))}: ${reason(c.commit.verification)}`,
            );
            const truncated = pr.commits > commits.length
              ? [``, `Only the first ${commits.length} of ${pr.commits} commits were checked.`]
              : [];

            const body = [
              MARKER,
              `Thanks for the PR! ${unsigned.length === 1 ? 'One commit isn\'t' : `${unsigned.length} commits aren't`} signed, and \`${pr.base.ref}\` only accepts verified commits, so this can't be merged yet:`,
              ``,
              ...rows,
              ...truncated,
              ``,
              `Once commit signing is set up, re-sign the branch and force-push (\`upstream\` is your remote for janhq/jan):`,
              ``,
              '```bash',
              `git fetch upstream`,
              `git rebase --force-rebase --gpg-sign upstream/${pr.base.ref}`,
              `git push --force-with-lease`,
              '```',
              ``,
              `How to set up signing: [CONTRIBUTING.md#signed-commits](${DOCS}). This comment goes away once every commit is verified.`,
            ].join('\n');

            if (sticky) {
              if (sticky.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: sticky.id, body });
              }
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            core.setFailed(`${unsigned.length} of ${commits.length} commits are not verified: ${unsigned.map((c) => c.sha.slice(0, 7)).join(', ')}`);
